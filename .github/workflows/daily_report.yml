name: Daily Autonomous AI Market Intelligence Workflow

on:
  schedule:
    - cron: '0 1 * * 1-5' # Runs at 01:00 UTC Mon-Fri
  workflow_dispatch:      # Enables manual execution trigger from GitHub UI

jobs:
  run-daily-intelligence:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Market Intelligence Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        PYTHONPATH: .
      run: |
        python scripts/daily_report.py

    - name: Commit & Push Archived Reports
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add reports/
        git diff --quiet && git diff --staged --quiet || (git commit -m "chmod: archive daily market intelligence report [skip ci]" && git push)
