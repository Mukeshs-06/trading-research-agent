name: Daily Autonomous AI Market Intelligence Workflow

on:
  schedule:
    - cron: '0 1 * * 1-5' # Runs at 01:00 UTC Mon-Fri
  workflow_dispatch:      # Enables manual execution trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-daily-intelligence:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.ref }}

    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Market Intelligence Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        PYTHONPATH: .
      run: |
        python scripts/daily_report.py

    - name: Commit & Push Archived Reports
      uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
      with:
        commit_message: "chmod: archive daily market intelligence report [skip ci]"
        file_pattern: "reports/*"
