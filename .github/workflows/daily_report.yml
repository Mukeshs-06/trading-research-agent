name: Daily Autonomous AI Market Intelligence Workflow

on:
  schedule:
    - cron: '0 1 * * 1-5' # Runs at 01:00 UTC Mon-Fri
  workflow_dispatch:      # Enables manual execution trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-daily-intelligence:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.ref }}

    - name: Set up Python 3.12
      uses: actions/setup-python@0a5c61591373683505dbb353538426011212936c # v5.3.0
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Market Intelligence Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        PYTHONPATH: .
      run: |
        python scripts/daily_report.py

    - name: Commit & Push Archived Reports
      uses: stefanzweifel/git-auto-commit-action@8621435c26c2d74ebd7778db29e138c200023057 # v5.0.1
      with:
        commit_message: "chmod: archive daily market intelligence report [skip ci]"
        file_pattern: "reports/*"
